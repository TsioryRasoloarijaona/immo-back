# --- Profil "dev" : accès LAN en HTTP simple (pas de TLS en dev local) ---
# app.jwt.cookie-secure=true (défaut, voir application.properties) pose le cookie access_token
# avec l'attribut Secure — un navigateur le jette silencieusement sur une connexion HTTP non
# chiffrée. Sur localhost ce n'est jamais un problème (les navigateurs traitent localhost comme
# un "contexte sécurisé" même en HTTP), mais dès qu'on accède au backend via une IP LAN
# (ex. http://192.168.11.114:8080, cas du test cross-device/téléphone), le cookie posé au login
# n'est jamais stocké — la connexion "réussit" (200 + Set-Cookie) mais rien ne persiste, toutes
# les requêtes suivantes repartent sans cookie. Voir instructions/from_front.md #7.
#
# Activer via SPRING_PROFILES_ACTIVE=dev (ou -Dspring.profiles.active=dev). Ne jamais activer
# ce profil dans un environnement exposé au-delà du LAN de dev — Secure=false s'applique à
# TOUTES les origines, pas seulement l'IP LAN visée.
app.jwt.cookie-secure=false
