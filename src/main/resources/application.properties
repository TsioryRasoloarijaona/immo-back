spring.application.name=immo-crm

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Source de verite : la base d'OMRAN Estate, SEULE base ecrite ------------
# Le CRM cohabite avec un logiciel de bureau qui ecrit dans le meme schema. Les deux
# frappent leurs numeros de dossier depuis le compteur AdmSequence : deux bases ecrites
# en parallele, ce sont deux fois le meme code pour deux clients differents — c'est
# arrive neuf fois, et aucun index unique ne l'empeche. D'ou une seule base ecrite.
#
#   ECRITURES -> ici          LECTURES -> spring.datasource.* ci-dessus, inchangee
#
# Le routage se fait sur le drapeau readOnly de la transaction : voir DataSourceConfig.
#
# HOST VIDE = MODE MONO-BASE, comportement identique a celui d'avant cette feature.
# Les valeurs par defaut vides sont deliberees, meme raison que pour le mail plus bas :
# 525 tests bootent le contexte complet, et une propriete sans defaut ferait echouer la
# suite entiere sur une variable d'environnement absente — un echec qui ressemblerait a
# un bug de code.
# SOURCE_DB_PWD est un SECRET et ne doit jamais figurer ici, ce fichier est suivi par git.
app.source-de-verite.host=${SOURCE_DB_HOST:}
app.source-de-verite.port=${SOURCE_DB_PORT:1433}
app.source-de-verite.nom=${SOURCE_DB_NAME:}
app.source-de-verite.username=${SOURCE_DB_USER:}
app.source-de-verite.password=${SOURCE_DB_PWD:}
# Le lien traverse le VPN : echouer vite plutot que faire attendre sur un formulaire.
app.source-de-verite.timeout-connexion-ms=${SOURCE_DB_TIMEOUT_MS:5000}
app.source-de-verite.taille-pool=${SOURCE_DB_POOL:5}
# Cadence (minutes) de la synchronisation descendante par Change Tracking — ce que le logiciel
# de bureau ecrit sur la source rejoint la copie au plus tard apres ce delai. Un cycle vide est
# quasi gratuit (CHANGETABLE ne renvoie que ce qui a change), d'ou un defaut serre : 2 min.
# Un declenchement manuel immediat reste possible via POST /api/synchronisation. Sans effet en mono-base.
app.source-de-verite.sync-minutes=${SOURCE_DB_SYNC_MINUTES:2}

# --- Trace d'audit OMRAN : archivage avant rotation ------------------------------
# L'audit serveur (Audit_Global -> C:\backup\*.sqlaudit) capte chaque requete du legataire,
# mais tourne sur 20 fichiers de 100 Mo : au-dela, SQL Server supprime les plus anciens et la
# trace OMRAN est perdue. ArchivageTraceOmran copie la part OMRAN dans AppTraceOmran (copie de
# lecture, db/migration/010_AppTraceOmran.sql) avant la rotation.
# CHEMIN VIDE = ARCHIVAGE INACTIF (le cas de la suite de tests et d'une source sans audit
# configure). Ne s'active qu'en mode deux-bases : la lecture se fait sur la source (c'est elle
# que frappe OMRAN, et sys.fn_get_audit_file exige CONTROL SERVER), l'archive s'ecrit sur la
# copie. Exemple de valeur : C:\backup\*.sqlaudit
app.trace-omran.chemin=${AUDIT_TRACE_PATH:}
# Cadence (minutes). La rotation laisse des semaines de marge : l'heure est une marge large.
app.trace-omran.minutes=${AUDIT_TRACE_MINUTES:60}

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Upload de pièces jointes (AdmAttachedFile) ---
# Default Spring Boot limits (1MB/file, 10MB/request) are too small — real dossier attachments
# (contrats scannés, décomptes...) observed up to ~25MB in AdmAttachedFile.AttachedFile.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs


springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# --- Stockage objet des pièces jointes (MinIO / S3) ---
# Les binaires ne sont plus en base : AdmAttachedFile.AttachedFile a été supprimée (c'était
# une colonne FILESTREAM, refusée au RESTORE par SQL Server pour Linux) et AppFileObject porte
# le pointeur. Voir instructions/FEATURE-s3-storage.md.
# Aucune valeur par défaut sur les secrets : ils viennent de l'environnement, comme DB_PWD et
# JWT_SECRET — ce fichier est suivi par git.
app.stockage.bucket=${S3_BUCKET}
app.stockage.endpoint=${S3_ENDPOINT}
app.stockage.region=${S3_REGION:us-east-1}
# Premier segment de clé, ex. 'dev' ou 'prod'. FACULTATIF depuis que chaque environnement a
# son propre bucket : il n'isolait que le cas d'un bucket partagé, où les deux bases étant des
# restaurations du même jeu de données, leurs PKey identiques auraient produit les mêmes clés.
# Le laisser vide donne des clés à la racine du bucket ; le renseigner reste utile pour rester
# cohérent avec les objets déjà déposés par la migration (préfixés 'prod/').
app.stockage.prefix=${S3_PREFIX:}
app.stockage.access-key=${S3_ACCESS_KEY}
app.stockage.secret-key=${S3_SECRET_KEY}
# Durée de validité des URL présignées : assez pour télécharger 35 Mo sur une liaison lente,
# assez court pour qu'une URL qui fuite n'ouvre pas un accès durable.
app.stockage.presign-minutes=15

# --- Auth (JWT httpOnly cookie) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
app.jwt.cookie-secure=true
# Strict, et c'est une contrainte de deploiement autant qu'un reglage : le frontend
# (immo.tsiory.tech) et l'API (api.tsiory.tech) partagent le domaine enregistrable tsiory.tech,
# donc leurs echanges sont same-site et le cookie est attache normalement. C'est aussi ce qui
# protege du CSRF, puisque SecurityConfig desactive la protection dediee.
#
# Heberger le frontend sur un autre domaine enregistrable (un *.vercel.app, par exemple) le
# rendrait cross-site : il faudrait passer a None, ce qui impose cookie-secure=true, rouvre le
# CSRF sur les POST multipart (voir SecurityConfig) et transforme le cookie en cookie tiers —
# donc bloque par Safari. Changer de domaine d'hebergement n'est pas un detail d'infrastructure.
app.jwt.cookie-same-site=Strict

# --- Envoi d'email (SMTP Hostinger) ---
# Voir instructions/FEATURE-service-envoi-email.md §4.
# Port 587 + STARTTLS plutot que 465 + SSL implicite : les deux fonctionnent chez Hostinger,
# mais 587 est le port de soumission standard, mieux tolere par les pare-feux sortants, et
# c'est celui que l'autoconfiguration Spring gere sans reglage supplementaire. Passer a 465
# imposerait de remplacer les proprietes starttls par mail.smtp.ssl.enable=true.
# Le defaut est smtp.titan.email et NON smtp.hostinger.com. Verifie le 08/09/2026 par un envoi
# reel : la boite pro est facturee par Hostinger mais HEBERGEE par Titan, que Hostinger revend.
# Les MX du domaine le disent (mx1/mx2.titan.email) et le SPF aussi (include:spf.titan.email).
# Avec smtp.hostinger.com, l'authentification echoue en « 535 5.7.8 authentication failed » —
# des identifiants valides presentes au mauvais serveur.
spring.mail.host=${MAIL_HOST:smtp.titan.email}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Un SMTP injoignable ne doit pas immobiliser un fil du pool mail : Hostinger repond en ~1 s,
# 10 s laissent la marge d'une liaison degradee sans faire trainer un envoi mort.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
#
# Contrairement au stockage S3, les secrets portent ici une valeur par defaut VIDE, et c'est
# deliberé : 525 tests bootent le contexte Spring complet, donc une propriete sans defaut
# ferait echouer toute la suite sur une variable d'environnement absente — un echec qui
# ressemblerait a un bug de code. La contrepartie est le controle de demarrage
# d'EnvoiEmailSmtp, qui journalise bruyamment une configuration incomplete et bascule le
# service en mode inactif plutot que de laisser croire qu'un mail est parti.
# Aucun mot de passe de boite ne figure dans ce fichier, qui est suivi par git.
app.mail.actif=${MAIL_ENABLED:true}
app.mail.expediteur=${MAIL_FROM:}
app.mail.nom-expediteur=${MAIL_FROM_NAME:Ayad Estate}
app.mail.url-application=${APP_URL:https://immo.tsiory.tech}
#
# OBLIGATOIRE, ce n'est pas un reglage de confort. spring-boot-starter-mail enregistre un
# MailHealthIndicator qui ouvre une connexion SMTP a CHAQUE appel de /actuator/health. Sans
# cette ligne, une boite Hostinger momentanement injoignable fait repondre 503 a
# /actuator/health, donc echouer la sonde post-deploiement qui interroge 127.0.0.1:9091 — et
# l'API entiere est declaree DOWN a cause d'un sous-systeme que cette feature traite
# justement comme non critique (envoi asynchrone, echec tolere, mot de passe toujours present
# dans la reponse HTTP). Mesure : ActuatorSecuriteTest passait de 200 a 503 et le test mettait
# 7 s a echouer sur l'expiration de la connexion.
management.health.mail.enabled=false

# --- Envoi WhatsApp (UltraMsg) ---
# Meme convention que le mail ci-dessus, et pour la meme raison : le jeton porte une valeur par
# defaut VIDE pour que la suite de tests boote sans variable d'environnement, et c'est
# EnvoiWhatsAppUltraMsg qui journalise bruyamment et bascule en mode inactif.
# WP_TOKEN est un SECRET et ne doit jamais figurer dans ce fichier, qui est suivi par git.
# WP_INSTANCE n'en est pas un (il apparait dans l'URL publique du compte) mais reste variable
# parce qu'il differe entre un compte d'essai et un compte de production.
app.whatsapp.actif=${WP_ENABLED:true}
app.whatsapp.token=${WP_TOKEN:}
app.whatsapp.instance=${WP_INSTANCE:}
app.whatsapp.url-base=${WP_URL:https://api.ultramsg.com}

# --- Metrics (Actuator/Micrometer) ---
# Actuator is served on its OWN port, not on server.port. Caddy proxies the whole of
# api.tsiory.tech to 8080, so anything mounted there is public; moving actuator off 8080
# makes the isolation structural rather than a reverse-proxy rule someone can break later.
# The compose file publishes this port on 127.0.0.1 only — Prometheus scrapes it over the
# docker network, the deployment probe curls it from the host, the internet cannot reach it.
# Consequence: https://api.tsiory.tech/actuator/health no longer answers, and the pipeline's
# post-deploy probe targets 127.0.0.1:9091.
management.server.port=9091
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=never
# Per-endpoint p50/p95/p99 tail latency, not just count/sum/max, tagged by uri/method/status.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# --- Version embarquée (voir config/InfosBuild) ---
# Posées par le Dockerfile à partir des build-args du workflow ; "inconnu" hors image.
# Exposées en jauge immo_back_build_info{tag,commit} et sur GET /actuator/info (port 9091).
app.build.tag=${APP_BUILD_TAG:inconnu}
app.build.commit=${APP_BUILD_COMMIT:inconnu}
