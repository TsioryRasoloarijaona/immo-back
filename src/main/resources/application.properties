spring.application.name=immo-crm

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Upload de pièces jointes (AdmAttachedFile) ---
# Default Spring Boot limits (1MB/file, 10MB/request) are too small — real dossier attachments
# (contrats scannés, décomptes...) observed up to ~25MB in AdmAttachedFile.AttachedFile.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs


springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# --- Stockage objet des pièces jointes (MinIO / S3) ---
# Les binaires ne sont plus en base : AdmAttachedFile.AttachedFile a été supprimée (c'était
# une colonne FILESTREAM, refusée au RESTORE par SQL Server pour Linux) et AppFileObject porte
# le pointeur. Voir instructions/FEATURE-s3-storage.md.
# Aucune valeur par défaut sur les secrets : ils viennent de l'environnement, comme DB_PWD et
# JWT_SECRET — ce fichier est suivi par git.
app.stockage.bucket=${S3_BUCKET}
app.stockage.endpoint=${S3_ENDPOINT}
app.stockage.region=${S3_REGION:us-east-1}
# Premier segment de clé, ex. 'dev' ou 'prod'. FACULTATIF depuis que chaque environnement a
# son propre bucket : il n'isolait que le cas d'un bucket partagé, où les deux bases étant des
# restaurations du même jeu de données, leurs PKey identiques auraient produit les mêmes clés.
# Le laisser vide donne des clés à la racine du bucket ; le renseigner reste utile pour rester
# cohérent avec les objets déjà déposés par la migration (préfixés 'prod/').
app.stockage.prefix=${S3_PREFIX:}
app.stockage.access-key=${S3_ACCESS_KEY}
app.stockage.secret-key=${S3_SECRET_KEY}
# Durée de validité des URL présignées : assez pour télécharger 35 Mo sur une liaison lente,
# assez court pour qu'une URL qui fuite n'ouvre pas un accès durable.
app.stockage.presign-minutes=15

# --- Auth (JWT httpOnly cookie) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
app.jwt.cookie-secure=true
# Strict, et c'est une contrainte de deploiement autant qu'un reglage : le frontend
# (immo.tsiory.tech) et l'API (api.tsiory.tech) partagent le domaine enregistrable tsiory.tech,
# donc leurs echanges sont same-site et le cookie est attache normalement. C'est aussi ce qui
# protege du CSRF, puisque SecurityConfig desactive la protection dediee.
#
# Heberger le frontend sur un autre domaine enregistrable (un *.vercel.app, par exemple) le
# rendrait cross-site : il faudrait passer a None, ce qui impose cookie-secure=true, rouvre le
# CSRF sur les POST multipart (voir SecurityConfig) et transforme le cookie en cookie tiers —
# donc bloque par Safari. Changer de domaine d'hebergement n'est pas un detail d'infrastructure.
app.jwt.cookie-same-site=Strict

# --- Metrics (Actuator/Micrometer) ---
# Actuator is served on its OWN port, not on server.port. Caddy proxies the whole of
# api.tsiory.tech to 8080, so anything mounted there is public; moving actuator off 8080
# makes the isolation structural rather than a reverse-proxy rule someone can break later.
# The compose file publishes this port on 127.0.0.1 only — Prometheus scrapes it over the
# docker network, the deployment probe curls it from the host, the internet cannot reach it.
# Consequence: https://api.tsiory.tech/actuator/health no longer answers, and the pipeline's
# post-deploy probe targets 127.0.0.1:9091.
management.server.port=9091
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
# Per-endpoint p50/p95/p99 tail latency, not just count/sum/max, tagged by uri/method/status.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
