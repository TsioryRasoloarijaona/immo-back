spring.application.name=immo-crm

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:49687;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs


springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# --- Auth (JWT httpOnly cookie) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
app.jwt.cookie-secure=true

# --- Metrics (Actuator/Micrometer) ---
# Exposed under /actuator/** ; not in the /api-docs|/api-auth permitAll list, so
# SecurityConfig's anyRequest().authenticated() applies (needs the JWT cookie).
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# Per-endpoint p50/p95/p99 tail latency, not just count/sum/max, tagged by uri/method/status.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99