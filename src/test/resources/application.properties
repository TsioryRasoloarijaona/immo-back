spring.application.name=immo-crm

spring.datasource.url=jdbc:sqlserver://localhost:49687;databaseName=yesRemsTest;encrypt=true;trustServerCertificate=true
spring.datasource.username=tsix
spring.datasource.password=securePassword123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Metrics (Actuator) ---
# Ce fichier REMPLACE src/main/resources/application.properties, il n'y ajoute rien : sans ces
# lignes, seul `health` serait exposé (défaut Spring Boot) et ActuatorSecuriteTest affirmerait
# des choses sur des endpoints non montés.
# management.server.port est volontairement ABSENT : l'environnement web MOCK n'ouvre aucun port
# réel, la propriété y serait ignorée. La sécurité, elle, se comporte de la même façon sur les
# deux ports — c'est ce que le test vérifie.
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=never

# --- Auth (JWT httpOnly cookie) ---
app.jwt.secret=test-secret-key-not-for-production-use-0123456789abcdef
app.jwt.expiration-minutes=480
app.jwt.cookie-secure=false
# Meme valeur qu'en production : le comportement du cookie ne doit pas dependre du profil.
app.jwt.cookie-same-site=Strict
# --- Stockage objet : valeurs factices ---
# StockageMemoire (@Primary, src/test/java) remplace StockageS3, donc rien ne part sur le
# reseau. Ces valeurs ne servent qu'a instancier les beans S3Client/S3Presigner au demarrage
# du contexte : le SDK ne se connecte pas a la construction.
app.stockage.bucket=bucket-de-test
app.stockage.endpoint=https://stockage-test.local
app.stockage.region=us-east-1
app.stockage.prefix=test
app.stockage.access-key=test
app.stockage.secret-key=test

# --- Envoi d'email : valeurs factices ---
# EnvoiEmailMemoire (@Primary, src/test/java) remplace EnvoiEmailSmtp, donc rien ne part sur
# le reseau. Ces valeurs ne servent qu'a instancier JavaMailSender au demarrage du contexte :
# l'autoconfiguration ne se connecte pas a la construction.
# app.mail.actif reste a TRUE : le double de test doit se comporter comme un service actif,
# sans quoi les assertions sur emailEnvoye verifieraient le mode degrade au lieu du cas normal.
spring.mail.host=smtp-test.local
spring.mail.port=587
spring.mail.username=test
spring.mail.password=test
app.mail.actif=true
app.mail.expediteur=no-reply@test.local
app.mail.nom-expediteur=Ayad Estate (test)
app.mail.url-application=https://immo-test.local
# Ce fichier REMPLACE celui de src/main/resources, la ligne doit donc y etre repetee : sans
# elle, /actuator/health tente d'atteindre smtp-test.local et repond 503 au bout de 7 s.
management.health.mail.enabled=false

# --- Envoi WhatsApp : valeurs factices ---
# EnvoiWhatsAppMemoire (@Primary, src/test/java) remplace EnvoiWhatsAppUltraMsg, donc aucun
# appel ne part vers api.ultramsg.com. L'enjeu est plus aigu que pour le mail : un envoi
# accidentel arriverait sur le telephone personnel d'un vrai prospect, immediatement et sans
# filtre anti-spam pour le retenir. Ces valeurs ne servent qu'a instancier le bean.
# app.whatsapp.actif reste a TRUE : le double doit se comporter comme un service actif, sans
# quoi les assertions verifieraient le mode degrade au lieu du cas normal.
app.whatsapp.actif=true
app.whatsapp.token=jeton-de-test
app.whatsapp.instance=instance-de-test
app.whatsapp.url-base=https://ultramsg-test.local
