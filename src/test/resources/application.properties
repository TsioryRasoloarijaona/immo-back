spring.application.name=immo-crm

spring.datasource.url=jdbc:sqlserver://localhost:49687;databaseName=yesRemsTest;encrypt=true;trustServerCertificate=true
spring.datasource.username=tsix
spring.datasource.password=securePassword123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Auth (JWT httpOnly cookie) ---
app.jwt.secret=test-secret-key-not-for-production-use-0123456789abcdef
app.jwt.expiration-minutes=480
app.jwt.cookie-secure=false